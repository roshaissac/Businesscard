<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C-6 · Buyer Intake</title><link rel="stylesheet" href="kit.css">
<style>:root{--app-accent:#d97047;--app-accent-soft:rgba(217,112,71,.18)}
/* threshold/arch motif */
.arch{position:absolute;right:-26px;top:14px;width:150px;height:200px;border:1.5px solid var(--app-accent);
  border-bottom:none;border-radius:75px 75px 0 0;opacity:.30}</style>
</head><body><div class="app">
  <header class="hero">
    <div class="arch"></div>
    <div class="eyebrow">Buyer Intake · Step 2 of 4</div>
    <h1 class="display">Let's find<br>your home.</h1>
    <div class="ribbon"><i class="on"></i><i class="on"></i><i></i><i></i></div>
  </header>
  <div class="seam"></div>
  <main class="work">
    <div class="panel">
      <div class="h-title">What's your budget?</div>
      <div class="chips"><span class="chip">Under $500k</span><span class="chip on">$500–700k</span><span class="chip">$700k+</span></div>
    </div>
    <div class="panel">
      <div class="h-title">Bedrooms</div>
      <div class="chips"><span class="chip">2</span><span class="chip on">3</span><span class="chip">4+</span></div>
    </div>
    <div class="panel">
      <div class="label">Preferred areas</div><div class="field active">Aspen Woods, Springbank</div>
    </div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:10px">
      <button class="btn-ghost">Back</button><button class="cta" style="margin:0">Continue</button>
    </div>
  </main>
  <footer class="band"><img src="../dreamhouse-logo.png" alt="Dreamhouse Realty Ltd.">
    <div class="b-txt"><b>Sheena &amp; Rosh Issac Property Group</b> — Associates of Dreamhouse Realty Ltd.</div></footer>
</div></body></html>
