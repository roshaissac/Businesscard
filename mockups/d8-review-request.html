<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D-8 · Google Review Request</title><link rel="stylesheet" href="kit.css">
<style>:root{--app-accent:#ef9a52;--app-accent-soft:rgba(239,154,82,.18)}
.quote{font-family:var(--serif);font-size:60px;line-height:.5;color:var(--app-accent);opacity:.5}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--c-hair-l);
  border-radius:999px;padding:14px;font-weight:600;font-size:15px;color:var(--c-charcoal)}
.g{width:18px;height:18px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0)}</style>
</head><body><div class="app">
  <header class="hero">
    <div class="eyebrow">Thank You</div>
    <div class="quote">&ldquo;</div>
    <h1 class="display" style="margin-top:2px">How did<br>we do?</h1>
    <p class="hero-sub">Your words help another Calgary family choose with confidence.</p>
  </header>
  <div class="seam"></div>
  <main class="work">
    <div class="panel" style="text-align:center">
      <div class="stars" style="justify-content:center">★★★★★</div>
      <p class="muted" style="margin-top:8px">Tap to rate your experience with Rosh</p>
    </div>
    <a class="gbtn"><span class="g"></span> Leave a Google review</a>
    <button class="btn-ghost">Share private feedback instead</button>
    <p class="muted" style="text-align:center">Takes ~20 seconds · opens Google Maps</p>
  </main>
  <footer class="band"><img src="../dreamhouse-logo.png" alt="Dreamhouse Realty Ltd.">
    <div class="b-txt"><b>Sheena &amp; Rosh Issac Property Group</b> — Associates of Dreamhouse Realty Ltd.</div></footer>
</div></body></html>
