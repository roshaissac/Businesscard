<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B-4 · Rental Investment Analysis</title><link rel="stylesheet" href="kit.css">
<style>:root{--app-accent:#d8973f;--app-accent-soft:rgba(216,151,63,.18)}
.big{font-family:var(--serif);font-size:clamp(44px,14vw,62px);font-weight:500;letter-spacing:-.02em;line-height:1;margin-top:10px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.metric{background:var(--c-ivory-card);border:1px solid var(--c-hair-l);border-radius:var(--radius-md);padding:13px}
.metric .v{font-family:var(--serif);font-size:22px;font-weight:500}
.metric .v.pos{color:var(--ok)}.metric .k{font-size:11px;color:var(--c-muted-l);margin-top:2px;letter-spacing:.04em}</style>
</head><body><div class="app">
  <header class="hero">
    <div class="eyebrow">Investment Analysis</div>
    <div class="big">7.4<span class="accent" style="font-size:.5em"> % cap</span></div>
    <p class="hero-sub">Projected first‑year return on 1450 Cedar Court — a quick deal read.</p>
  </header>
  <div class="seam"></div>
  <main class="work">
    <div class="metrics">
      <div class="metric"><div class="v pos">+$412</div><div class="k">CASH FLOW/MO</div></div>
      <div class="metric"><div class="v">7.4%</div><div class="k">CAP RATE</div></div>
      <div class="metric"><div class="v">9.1%</div><div class="k">CASH/CASH</div></div>
    </div>
    <div class="panel">
      <div class="label">Purchase price</div><div class="field">$525,000</div>
      <div class="label" style="margin-top:12px">Monthly rent</div><div class="field active">$2,850</div>
      <div class="label" style="margin-top:12px">Expenses &amp; vacancy</div><div class="field">$640 / mo</div>
    </div>
    <button class="cta">Full breakdown</button>
  </main>
  <footer class="band"><img src="../dreamhouse-logo.png" alt="Dreamhouse Realty Ltd.">
    <div class="b-txt"><b>Sheena &amp; Rosh Issac Property Group</b> — Associates of Dreamhouse Realty Ltd.</div></footer>
</div></body></html>
