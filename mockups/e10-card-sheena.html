<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-10 · Business Card — Sheena</title><link rel="stylesheet" href="kit.css">
<style>:root{--app-accent:#ee8a4e;--app-accent-soft:rgba(238,138,78,.18)}
.app{background:var(--c-paper)}
.cardhero{padding-bottom:24px}
.mono{width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-weight:700;font-size:40px;color:var(--c-ink);background:var(--c-card);
  border:2px solid var(--app-accent);box-shadow:0 0 0 5px var(--app-accent-soft)}
.mono i{color:var(--app-accent);font-style:normal}
.name{font-family:var(--sans);font-weight:700;font-size:30px;letter-spacing:-.01em;margin-top:16px}
.role{color:var(--app-accent);font-weight:600;font-size:14px;margin-top:4px}
.cred{color:var(--c-ink-soft);font-size:13px;margin-top:2px}
.dwork{background:var(--c-paper);padding:4px 26px 24px;display:flex;flex-direction:column;gap:11px}
.darkbtn{border:1px solid var(--c-hair-d);border-radius:999px;padding:14px;text-align:center;font-weight:600;font-size:14px;color:var(--c-ink)}
.contact{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--c-ink-soft)}
.contact .accent{color:var(--app-accent)}</style>
</head><body><div class="app">
  <header class="hero cardhero">
    <div class="mono">S<i>I</i></div>
    <div class="name">Sheena Issac</div>
    <div class="role">Realtor®</div>
    <div class="cred">Sheena &amp; Rosh Issac Property Group</div>
    <div class="contact"><span><span class="accent">↘</span> (403) 555‑0101</span><span><span class="accent">✉</span> sheena@issacrealty.com</span></div>
  </header>
  <div class="dwork">
    <button class="cta" style="margin-top:6px">Save my contact</button>
    <button class="darkbtn">Exchange details</button>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px">
      <button class="darkbtn">WhatsApp</button><button class="darkbtn">LinkedIn</button><button class="darkbtn">Website</button>
    </div>
  </div>
  <footer class="band"><img src="../dreamhouse-logo.png" alt="Dreamhouse Realty Ltd.">
    <div class="b-txt"><b>Sheena &amp; Rosh Issac Property Group</b> — Associates of Dreamhouse Realty Ltd.</div></footer>
</div></body></html>
