<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B-3 · Affordability Calculator</title><link rel="stylesheet" href="kit.css">
<style>:root{--app-accent:#e3a049;--app-accent-soft:rgba(227,160,73,.18)}
.big{font-family:var(--serif);font-size:clamp(46px,15vw,68px);font-weight:500;letter-spacing:-.02em;line-height:1;margin-top:10px}
.big .c{color:var(--app-accent)}
.range{display:flex;justify-content:space-between;font-size:12px;color:var(--c-muted-l);margin-top:2px}</style>
</head><body><div class="app">
  <header class="hero">
    <div class="eyebrow">Affordability</div>
    <div class="big"><span class="c">$</span>642,000</div>
    <p class="hero-sub">Your estimated buying power, updated as you adjust the numbers below.</p>
  </header>
  <div class="seam"></div>
  <main class="work">
    <div class="panel">
      <div class="h-title">Household income <span class="accent" style="float:right">$135,000/yr</span></div>
      <div class="slider"><div class="fill" style="width:62%"></div><div class="thumb" style="left:62%"></div></div>
      <div class="range"><span>$40k</span><span>$250k</span></div>
    </div>
    <div class="panel">
      <div class="h-title">Down payment <span class="accent" style="float:right">$80,000</span></div>
      <div class="slider"><div class="fill" style="width:34%"></div><div class="thumb" style="left:34%"></div></div>
      <div class="range"><span>5%</span><span>35%</span></div>
    </div>
    <div class="panel">
      <div class="h-title">Interest rate <span class="accent" style="float:right">5.4%</span></div>
      <div class="slider"><div class="fill" style="width:48%"></div><div class="thumb" style="left:48%"></div></div>
      <div class="range"><span>3%</span><span>8%</span></div>
    </div>
    <button class="cta">See homes in my range</button>
  </main>
  <footer class="band"><img src="../dreamhouse-logo.png" alt="Dreamhouse Realty Ltd.">
    <div class="b-txt"><b>Sheena &amp; Rosh Issac Property Group</b> — Associates of Dreamhouse Realty Ltd.</div></footer>
</div></body></html>
