<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B-5 · Rent vs Ownership</title><link rel="stylesheet" href="kit.css">
<style>:root{--app-accent:#c98a4a;--app-accent-soft:rgba(201,138,74,.18)}
.big{font-family:var(--serif);font-size:clamp(34px,9vw,46px);font-weight:500;line-height:1.04;letter-spacing:-.01em;margin-top:12px}
.versus{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{background:var(--c-ivory-card);border:1px solid var(--c-hair-l);border-radius:var(--radius-md);padding:15px;text-align:center}
.col.win{border-color:var(--app-accent);box-shadow:0 0 0 3px var(--app-accent-soft)}
.col .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted-l);font-weight:600}
.col .v{font-family:var(--serif);font-size:27px;font-weight:500;margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:7px;height:64px;margin-top:14px;justify-content:center}
.bars i{width:16px;border-radius:5px 5px 0 0;background:var(--c-hair-d)}
.bars i.a{background:var(--app-accent)}</style>
</head><body><div class="app">
  <header class="hero">
    <div class="eyebrow">Rent vs Own</div>
    <h1 class="big">Owning pulls ahead<br>in <span class="accent">year 4</span>.</h1>
    <div class="bars"><i style="height:30%"></i><i style="height:42%"></i><i style="height:56%"></i><i class="a" style="height:72%"></i><i class="a" style="height:92%"></i></div>
  </header>
  <div class="seam"></div>
  <main class="work">
    <div class="versus">
      <div class="col"><div class="t">Keep renting</div><div class="v">$0</div><div class="muted" style="margin-top:4px">equity in 5 yrs</div></div>
      <div class="col win"><div class="t">Buy now</div><div class="v">$86,400</div><div class="muted" style="margin-top:4px">equity in 5 yrs</div></div>
    </div>
    <div class="panel">
      <div class="label">Monthly rent today</div><div class="field">$2,300</div>
      <div class="label" style="margin-top:12px">Target home price</div><div class="field active">$560,000</div>
    </div>
    <button class="cta">Compare my scenario</button>
  </main>
  <footer class="band"><img src="../dreamhouse-logo.png" alt="Dreamhouse Realty Ltd.">
    <div class="b-txt"><b>Sheena &amp; Rosh Issac Property Group</b> — Associates of Dreamhouse Realty Ltd.</div></footer>
</div></body></html>
